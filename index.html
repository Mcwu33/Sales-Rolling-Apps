<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sales-Rolling-Apps</title>
    
    <!-- 纯内联图标 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📊%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📊%3C/text%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        excel: {
                            green: '#107c41',
                            light: '#f3f4f6',
                            border: '#e5e7eb',
                            focus: '#185abd'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #1f2937;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }
        .page-transition {
            animation: fadeIn 0.15s ease-in-out;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-100">

    <!-- 顶部 Header -->
    <div class="max-w-md mx-auto w-full p-4 pb-2 space-y-3">
        <div class="flex justify-between items-center px-1">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📊</span>
                <h1 id="sheetTitleDisplay" class="text-lg font-bold tracking-wider text-emerald-700 cursor-pointer truncate max-w-[220px]" onclick="renameCurrentSheet()" title="点击重命名 Sheet">Sales-Rolling-Apps</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="clearCurrentSheet()" class="bg-gray-200 text-gray-700 font-bold px-3 py-2 rounded-xl text-xs active:scale-95 transition shadow-2xs" title="清空当前 Sheet 数据">
                    🧹 清空
                </button>
            </div>
        </div>

        <!-- 统计面板 -->
        <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-emerald-100 flex justify-between items-center">
            <div>
                <span class="text-[11px] text-gray-400 uppercase tracking-wider block font-semibold">Checked Total (已勾选合计)</span>
                <div id="checkedTotalDisplay" class="text-2xl font-black text-emerald-600">0.00</div>
            </div>
            <div class="text-right border-l border-gray-100 pl-4">
                <span class="text-[11px] text-gray-400 uppercase tracking-wider block font-semibold">Grand Total (全页总计)</span>
                <div id="grandTotalDisplay" class="text-2xl font-black text-gray-800">0.00</div>
            </div>
        </div>
    </div>

    <!-- 中间 33 行固定表格区 (加大行高与触控间距) -->
    <div class="max-w-md mx-auto w-full p-4 pt-1 space-y-2.5 pb-40 page-transition flex-1 overflow-y-auto" id="rowsContainer">
        <!-- 动态生成 33 行 -->
    </div>

    <!-- 底部 Excel 风格 Sheet 标签栏 (巨幅放大版，适合大拇指轻松点按) -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-gray-200 px-3.5 py-3.5 flex items-center space-x-2.5 z-50 shadow-2xl">
        <div id="sheetTabsContainer" class="flex items-center space-x-2 flex-1 overflow-x-auto no-scrollbar py-1">
            <!-- 动态生成 Sheet 标签 -->
        </div>
        <button onclick="addNewSheet()" class="w-12 h-12 bg-emerald-600 text-white hover:bg-emerald-700 rounded-2xl flex items-center justify-center font-bold text-2xl transition shrink-0 active:scale-95 shadow-md" title="新增 Sheet 页面">
            +
        </button>
    </div>

    <!-- Core JavaScript -->
    <script>
        function createDefault33Rows() {
            let rows = [];
            for (let i = 1; i <= 33; i++) {
                rows.push({
                    id: Date.now() + i,
                    checked: false,
                    pending: false,
                    label: `${i}`,
                    amount: ''
                });
            }
            return rows;
        }

        let appData = JSON.parse(localStorage.getItem('sales_excel_sheets')) || [
            {
                id: 1,
                name: "Sheet 1",
                rows: createDefault33Rows()
            }
        ];

        let activeSheetId = parseInt(localStorage.getItem('sales_excel_active_sheet')) || appData[0].id;

        function saveData() {
            localStorage.setItem('sales_excel_sheets', JSON.stringify(appData));
            localStorage.setItem('sales_excel_active_sheet', activeSheetId);
            render();
        }

        function getCurrentSheet() {
            let sheet = appData.find(s => s.id === activeSheetId);
            if (!sheet && appData.length > 0) {
                activeSheetId = appData[0].id;
                sheet = appData[0];
            }
            return sheet;
        }

        function switchSheet(id) {
            activeSheetId = id;
            saveData();
        }

        function addNewSheet() {
            let newId = Date.now();
            let newName = `Sheet ${appData.length + 1}`;
            appData.push({
                id: newId,
                name: newName,
                rows: createDefault33Rows()
            });
            activeSheetId = newId;
            saveData();
        }

        function renameCurrentSheet() {
            let sheet = getCurrentSheet();
            if (!sheet) return;
            let newName = prompt("重命名当前 Sheet 页面:", sheet.name);
            if (newName !== null && newName.trim() !== "") {
                sheet.name = newName.trim();
                saveData();
            }
        }

        function moveSheet(index, direction) {
            let targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= appData.length) return;
            let temp = appData[index];
            appData[index] = appData[targetIndex];
            appData[targetIndex] = temp;
            saveData();
        }

        function deleteCurrentSheet(id, event) {
            event.stopPropagation();
            if (appData.length <= 1) {
                alert("至少需要保留一个 Sheet 页面！");
                return;
            }
            if (confirm("确定要删除这个 Sheet 吗？")) {
                appData = appData.filter(s => s.id !== id);
                if (activeSheetId === id) {
                    activeSheetId = appData[0].id;
                }
                saveData();
            }
        }

        function clearCurrentSheet() {
            let sheet = getCurrentSheet();
            if (!sheet) return;
            if (confirm("确定要清空当前 Sheet 的所有勾选、状态和数字吗？")) {
                sheet.rows.forEach(r => {
                    r.checked = false;
                    r.pending = false;
                    r.amount = '';
                });
                saveData();
            }
        }

        function toggleRowCheck(rowId) {
            let sheet = getCurrentSheet();
            if (!sheet) return;
            let row = sheet.rows.find(r => r.id === rowId);
            if (row) {
                row.checked = !row.checked;
                saveData();
            }
        }

        function toggleRowPending(rowId) {
            let sheet = getCurrentSheet();
            if (!sheet) return;
            let row = sheet.rows.find(r => r.id === rowId);
            if (row) {
                row.pending = !row.pending;
                saveData();
            }
        }

        function updateRowData(rowId, field, value) {
            let sheet = getCurrentSheet();
            if (!sheet) return;
            let row = sheet.rows.find(r => r.id === rowId);
            if (row) {
                if (field === 'label') {
                    row.label = value;
                } else if (field === 'amount') {
                    row.amount = value === '' ? '' : parseFloat(value);
                }
                saveData();
            }
        }

        // ================= 核心渲染引擎 =================
        function render() {
            let sheet = getCurrentSheet();
            if (!sheet) return;

            // 1. 渲染顶部标题
            document.getElementById('sheetTitleDisplay').textContent = sheet.name;

            // 2. 渲染底部 Sheet 标签栏 (特大号触控区 + 名字横向滚动)
            let tabsContainer = document.getElementById('sheetTabsContainer');
            tabsContainer.innerHTML = appData.map((s, index) => {
                let isActive = s.id === activeSheetId;
                return `
                    <div class="flex items-center space-x-2 shrink-0 ${isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'} px-4 py-2.5 rounded-2xl text-xs font-bold transition">
                        <div onclick="switchSheet(${s.id})" class="cursor-pointer flex items-center space-x-1.5 max-w-[130px] truncate" title="${s.name}">
                            <span class="text-sm">📊</span>
                            <span class="truncate">${s.name}</span>
                        </div>
                        <div class="flex items-center space-x-1 ml-1 opacity-90">
                            ${index > 0 ? `<button onclick="moveSheet(${index}, -1)" title="向左移动" class="px-1.5 py-1 hover:bg-black/10 rounded-lg text-xs">◀</button>` : ''}
                            ${index < appData.length - 1 ? `<button onclick="moveSheet(${index}, 1)" title="向右移动" class="px-1.5 py-1 hover:bg-black/10 rounded-lg text-xs">▶</button>` : ''}
                            ${appData.length > 1 ? `<button onclick="deleteCurrentSheet(${s.id}, event)" title="删除" class="px-1.5 py-1 hover:text-rose-200 text-sm">×</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // 3. 计算统计数据
            let checkedTotal = 0;
            let grandTotal = 0;

            sheet.rows.forEach(r => {
                let amt = Number(r.amount) || 0;
                grandTotal += amt;
                if (r.checked) {
                    checkedTotal += amt;
                }
            });

            document.getElementById('checkedTotalDisplay').textContent = checkedTotal.toFixed(2);
            document.getElementById('grandTotalDisplay').textContent = grandTotal.toFixed(2);

            // 4. 渲染固定 33 行 (加大加宽每个行卡片)
            let rowsContainer = document.getElementById('rowsContainer');
            rowsContainer.innerHTML = sheet.rows.map((r, idx) => {
                let amountColorClass = r.pending ? 'text-rose-600 font-black' : 'text-emerald-700 font-bold';

                return `
                    <div class="bg-white p-3.5 rounded-2xl shadow-2xs border ${r.checked ? 'border-emerald-500 bg-emerald-50/50' : 'border-gray-200'} flex items-center justify-between space-x-2.5 transition">
                        <!-- 序号与主勾选框与标签 (大号复选框) -->
                        <div class="flex items-center space-x-3 flex-1">
                            <span class="text-xs text-gray-400 font-mono w-6 text-right">${idx + 1}</span>
                            <input type="checkbox" ${r.checked ? 'checked' : ''} onchange="toggleRowCheck(${r.id})" class="w-6 h-6 accent-emerald-600 cursor-pointer rounded-md" title="勾选计入统计">
                            <input type="text" value="${r.label}" onchange="updateRowData(${r.id}, 'label', this.value)" class="bg-transparent text-sm font-semibold text-gray-800 focus:outline-none w-full border-b border-transparent focus:border-emerald-500 pb-0.5">
                        </div>

                        <!-- 金额输入框与 ⏳ 状态勾选 (增大整体点击区) -->
                        <div class="flex items-center space-x-2.5 shrink-0">
                            <label class="flex items-center space-x-1 cursor-pointer bg-gray-50 hover:bg-gray-100 px-2 py-1.5 rounded-xl border border-gray-200 text-xs" title="标记待定/红字 (⏳)">
                                <span class="select-none text-sm">⏳</span>
                                <input type="checkbox" ${r.pending ? 'checked' : ''} onchange="toggleRowPending(${r.id})" class="w-4 h-4 accent-rose-600 cursor-pointer rounded">
                            </label>

                            <div class="flex items-center bg-gray-50 px-2.5 py-1.5 rounded-xl border border-gray-200">
                                <span class="text-[10px] text-gray-400 mr-1.5 font-semibold">RM</span>
                                <input type="number" step="0.01" value="${r.amount !== '' ? r.amount : ''}" placeholder="" onchange="updateRowData(${r.id}, 'amount', this.value)" class="bg-transparent text-sm ${amountColorClass} w-24 text-right focus:outline-none">
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 初始化渲染
        render();
    </script>
</body>
</html>
